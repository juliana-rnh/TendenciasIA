name: Executar Agente de Tendencias IA

on:
  schedule:
    # Roda todos os dias às 09:00 Horário de Brasília (12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch: # Permite execução manual pelo botão no GitHub

jobs:
  rodar_agente:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar o Python na Maquina
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar as Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar o Script do Agente
      env:
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python agent.py

    - name: Salvar alteracoes no historico (Memoria do Agente)
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add historico.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Agente: Atualizando histórico de ferramentas" && git push)
